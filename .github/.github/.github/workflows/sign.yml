name: Cloud Sign IPA
on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Direct Link of your YouTube IPA'
        required: true

jobs:
  sign:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Asset (IPASigner)
        run: |
          chmod +x IPASigner
          # ಇಲ್ಲಿ ಸಾಫ್ಟ್‌ವೇರ್‌ಗೆ ಪರ್ಮಿಷನ್ ಸಿಗುತ್ತೆ

      - name: Run Cloud Sign
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          curl -L "${{ github.event.inputs.ipa_url }}" -o input.ipa
          # ಅಸಲಿ ಆಪಲ್ ಐಡಿ ಸರ್ಟಿಫಿಕೇಟ್ ಇಂಜೆಕ್ಟ್ ಮಾಡೋ ಕಮಾಂಡ್:
          ./IPASigner -i input.ipa -u "$APPLE_ID" -p "$APPLE_PASSWORD" -o YouTube-Signed.ipa

      - name: Create Direct Install Link
        run: |
          cat <<EOF > install.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>items</key>
            <array>
              <dict>
                <key>assets</key>
                <array>
                  <dict>
                    <key>kind</key>
                    <string>software-package</string>
                    <key>url</key>
                    <string>https://github.com/${{ github.repository }}/releases/download/v2/YouTube-Signed.ipa</string>
                  </dict>
                </array>
                <key>metadata</key>
                <dict>
                  <key>bundle-identifier</key>
                  <string>com.nagu.youtube</string>
                  <key>bundle-version</key>
                  <string>1.0</string>
                  <key>kind</key>
                  <string>software</string>
                  <key>title</key>
                  <string>YouTube Premium</string>
                </dict>
              </dict>
            </array>
          </dict>
          </plist>
          EOF

      - name: Deploy to Release v2
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2
          files: |
            YouTube-Signed.ipa
            install.plist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
